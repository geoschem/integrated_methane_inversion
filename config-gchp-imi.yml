## IMI configuration file
## Documentation @ https://imi.readthedocs.io/en/latest/getting-started/imi-config-file.html

## General
RunName: "Global_1yr_2025_C36S10_T006"
UseSlurm: true
SafeMode: false
S3Upload: false

UseGCHP: true
## Even integer representing number of grid cells per cubed-sphere face side
CS_RES: 36
STRETCH_GRID: true
STRETCH_FACTOR: 10.0
TARGET_LAT: 67.0
# note that target_lon needs to be in range of [-180,180) to accommandate the use of pygeohash for the convection of naming for gridspec file creation, the names for all target_lon > 180 would be the same with pygeohash
TARGET_LON: 20.0

#------------------------------------------------
#   COMPUTE RESOURCES for GCHP runs
#------------------------------------------------
# Total cores must be divisible by 6
TOTAL_CORES: 48
NUM_NODES: 1
NUM_CORES_PER_NODE: 48

## Period of interest
StartDate: 20250101
EndDate: 20250104
SpinupMonths: 1
Checkpoint_Freq: 240000

## Use blended TROPOMI+GOSAT data (true)? Or use operational TROPOMI data (false)?
BlendedTROPOMI: true

## Use observations over water? Set to false to filter out water observations
UseWaterObs: false

## Is this a regional inversion? Set to false for global inversion
isRegional: false

## Select two character region ID (for using pre-cropped meteorological fields)
##   Current options are listed below with ([lat],[lon]) bounds:
##     "AF" : Africa ([-37,40], [-20,53])
##     "AS" : Asia ([-11,55],[60,150])
##     "EU" : Europe ([33,61],[-30,70])
##     "ME" : Middle East ([12,50], [-20,70])
##     "NA" : North America ([10,70],[-140,-40])
##     "OC" : Oceania ([-50,5], [110,180])
##     "RU" : Russia ([41,83], [19,180])
##     "SA" : South America ([-59,16], [-88,-31])
##     ""   : Use for global global simulation or custom regions
##   For example, if the region of interest is in Europe ([33,61],[-30,70]), select "EU".
RegionID: ""

## Region of interest
##   These lat/lon bounds are only used if CreateAutomaticRectilinearStateVectorFile: true
##   Otherwise lat/lon bounds are determined from StateVectorFile
LonMin: -180
LonMax: 180
LatMin: -90
LatMax: 90

## Kalman filter options
KalmanMode: false
UpdateFreqDays: 7
NudgeFactor: 0.1
MakePeriodsCSV: true
CustomPeriodsCSV: "/path/to/periods.csv"

## State vector
CreateAutomaticRectilinearStateVectorFile: true
nBufferClusters: 0
BufferDeg: 0
EmisThreshold: 1.68e-11
OptimizeBCs: false
OptimizeOH: false
# optimize soil option when using normal errors, 
# do not use it when using Lognormal errors as negative flux is not allowed with lognormal errors, 
# do not use it either when it is GCC regional simulation with buffer cluster 
# or when clustering sv elements is enabled
# as median scaling factor for many state vector elements could result in strong positive scaling factor 
# to be applied to a pixel with negative soil flux
OptimizeSoil: false

## Point source datasets
## Used for visualizations and state vector clustering
PointSourceDatasets: ["SRON"]

## Clustering Options
ReducedDimensionStateVector: false
DynamicKFClustering: false
ClusteringMethod: "mini-batch-kmeans"
NumberOfElements: 10000
# emission rate threshold in unit of kg/hr
EmissionRateFilter: 2500
PlumeCountFilter: 0
GroupByCountry: true
CountryMaskPath: "/n/holylfs06/LABS/jacob_lab2/Lab/dzhang8/supportData/mask/country_id_mask_01x01.nc4"
ClusteringThreshold: 0.7
MaxClusterSize: 64

## Custom state vector
StateVectorFile: ""
ShapeFile: "None"
# Option to be used when the reference state vector file is defined on different grid(s).
# When they are on different grids, we still enable CreateAutomaticRectilinearStateVectorFile to 
# fascilitate the regridding process.
RegridStateVector: false
# Reference state vector file (e.g., state vector file for ensemble stretched GCHP)
ReferenceStateVectorFile: "/n/holylfs06/LABS/jacob_lab2/Lab/dzhang8/imi-gchp-test/imi-gchp-precomputedK/StateVector_c36_s10.0_combined.nc"
# The directory containing the grid spec files for the state vector grids, 
# which are needed for regridding
ReferenceSVTileGridDir: "/n/holylfs06/LABS/jacob_lab2/Lab/dzhang8/imi-gchp-test/git-code-supData/sup_data"

## Inversion
## Notes:
## - PriorError is a relative fraction (e.g. 0.5 = 50%)
## - If lognormal PriorError is the geometric standard deviation (e.g. 2 = factor of 2 uncertainty)
## - PriorErrorOH is a relative fraction (e.g. 0.1 = 10%)
## - PriorErrorBCs is in ppb (not used for global)
## - PriorErrorBufferElements is only used if LognormalErrors is true
LognormalErrors: false
PriorError: [0.5]
PriorErrorBCs: [10.0]
PriorErrorBufferElements: [0.5]
PriorErrorOH: [0.1]
ObsError: [15]
Gamma: [1.0]
PrecomputedJacobian: false
## When the grids do not match, regridding precomputed K; otherwise set it to false
RegridPrecomputedK: false
OnlyEmisPrecomputedK: false
MultiPrecomputedJacobian: false
ReferenceRunDir: ""

# Postprocess spatially complete diagnostics at satellite overpass time
SatelliteDiagnostics: true
OverpassTime: "13:30"
OrbitDirection: "ascending"
OrbitsPerDay: 14

## Grid
##   Options are 0.25x0.3125 (GEOSFP only), 0.5x0.625, 2.0x2.5, or 4.0x5.0
Res: "2.0x2.5"

## Meteorology
##   Options are GEOSFP or MERRA2
Met: "GEOSFP"

## Setup modules
##   Turn on/off different steps in setting up the inversion
RunSetup: true
SetupTemplateRundir: false
# add option to setup HemcoPriorEmis run directory when UseGCHP is true,
#  so that we can separate set-up with running the dir

SetupHemcoPriorEmisRunDir: false
SetupSpinupRun: false
SetupJacobianRuns: true
SetupInversion: false
SetupPosteriorRun: false
# If we only need to calculate Jacobians for emission/BC state vector elements,
#   which means we only need base run of 0001 and Run0000 is not needed,
#   we can disable Run0000 to save computing cost, default to false
DisableRun0000: true

## Run modules
##   Turn on/off different steps in performing the inversion
DoHemcoPriorEmis: false
# add option to regrid the reference HemcoPriorEmis file to the current GCHP grid,
#  which is exclusive with DoHemcoPriorEmis, default to false
RegridHemcoPriorEmis: false
# regrid reference HemcoPriorEmis (assumed to be on C360 grid) to the current GCHP grid (e.g., C36S10)
ReferencePriorEmisDir: "/home/ec2-user/fsx/output/Global_1yr_2025_C360/hemco_prior_emis/OutputDir"
DoSpinup: false
DoJacobian: false
ReDoJacobian: false
DoSatelliteDiagnostics: false
# Use satellite diagnostics to compute the Jacobian (i.e. satellite operator) for the inversion
SatDiagOperator: false
DoInversion: false
# If we only need to calculate Jacobians for emission/BC state vector elements,
#  and if DisableRun0000 is true, we cannot run invert.py to calculate posterior results, 
#  as Run0000 (and thus obs_GC) will be undefined in the archived pkl file
#  The purpose of this IMI is to archive Jacobians and to be applied for another inversion
ArchiveJacobiansOnly: false
DoPosterior: false

## Delete jacobian_runs/*/OutputDir files both processing stages are finished
##  with, at the end of the run. OutputDir is scratch: it exists so the overpass
##  and inversion stages can run, and left in place it is what makes the archive
##  unmanageable.
##
## Gated on the completion markers, not on this flag alone. src/utilities/
##  prune_outputdir.py refuses unless an overpass and an inversion marker both
##  exist and carry the same shared end date, which happens only when both
##  stages completed over a consistent window. A submission that ran one stage
##  leaves the two disagreeing and nothing is deleted.
##
## Where the filesystem exports its own deletes (FSx with a DELETED autoexport
##  policy), this is all that is needed to shrink the archive too.
#PruneOutputDir: true

## IMI preview
##   NOTE: RunSetup must be true to run preview
DoPreview: false
DOFSThreshold: 0

## Resource allocation settings for slurm jobs
RequestedCPUs: 48
RequestedMemory: 180G
InversionCPUs: 16
InversionMemory: 120G
InversionTime: "0-3:30"
RequestedTime: "0-3:30"
SchedulerPartition: "spot-48vcpus"
InvSchedulerPartition: "postprocess-spot"
## Max number of simultaneous Jacobian runs from the job array (-1: no limit)
MaxSimultaneousRuns: -1

## Number of Jacobians tracers to use for each jacobian simulation
##   Specifying a value = 1 will submit a separate jacobian simulation for each
##   state vector element. Specifying a value > 1 will combine state vector
##   elements into a single jacobian simulation.
NumJacobianTracers: 200

##====================================================================
##
## Advanced Settings (optional)
##
##====================================================================

## These settings are intended for advanced users who wish to:
##   a. modify additional GEOS-Chem options, or
##   b. run the IMI on a local cluster.
## They can be ignored for any standard cloud application of the IMI.

##--------------------------------------------------------------------
## Additional settings for GEOS-Chem simulations
##--------------------------------------------------------------------

## Jacobian settings
## Note PerturbValue is in 1e-8 kg/m2/s. eg specifying 1 means the
## perturbation will be 1e-8 kg/m2/s
## PerturbValueOH is a relative scale factor and PerturbValueBCs is in ppb
PerturbValue: 1.0
PerturbValueOH: 1.1
PerturbValueBCs: 10.0

## Save out hourly diagnostics from GEOS-Chem?
## For use in satellite operators via post-processing -- required for TROPOMI
## inversions
HourlyCH4: true

## IMI validation
## Turn on ObsPack diagnostic in GEOS-Chem?
DoObsPack: false

## Turn on planeflight diagnostic in GEOS-Chem?
## For use in comparing GEOS-Chem against planeflight data. The path
## to those data must be specified in geoschem_config.yml.
PLANEFLIGHT: false

## Turn on old observation operators in GEOS-Chem?
## These will save out text files comparing GEOS-Chem to observations, but have
## to be manually incorporated into the IMI
GOSAT: false
TCCON: false
AIRS: false

##------------------------------------------------------------------
## Settings for running on local cluster
##------------------------------------------------------------------

## Path for IMI runs and output
OutputPath: "/home/ec2-user/fsx/output//single_tests_N200_3day_C36S10"

## Path to GEOS-Chem input data
DataPath: "/home/ec2-user/fsx/input/ExtData"

## Path to TROPOMI Data
DataPathTROPOMI: "/home/ec2-user/fsx/input/blended-tropomi"

## Conda environment file
## See envs/README to create the Conda environment specified below
CondaEnv: "imi_env"
CondaFile: "${HOME}/.bashrc"

## GCHP environment file (with fortran compiler, netcdf libraries, etc.)
##   NOTE: Copy your own file in the envs/ directory within the IMI
GEOSChemEnv: "${HOME}/gchp.env"

## Download initial restart file from AWS S3?
##   NOTE: Must have AWS CLI enabled
RestartDownload: false

## Path to initial GEOS-Chem restart file + prefix
##   ("YYYYMMDD_0000z.nc4" will be appended)
RestartFilePrefix: "/home/ec2-user/fsx/input/blended-boundary-conditions/v2025-12/GEOSChem.BoundaryConditions."

## Path to GEOS-Chem boundary condition files (for regional simulations)
## BCversion will be appended to the end of this path. ${BCpath}/${BCversion}
BCpath: "/home/ec2-user/fsx/input/blended-boundary-conditions"
BCversion: "v2025-12"

## Options to download missing GEOS-Chem input data from AWS S3
##   NOTE: Must have AWS CLI enabled
HemcoPriorEmisDryRun: false
SpinupDryrun: false
ProductionDryRun: false
PosteriorDryRun: false
BCdryrun: false