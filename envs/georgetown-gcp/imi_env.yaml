name: imi_env
channels:
- conda-forge
- nodefaults
dependencies:
- python=3.11.6
- boto3=1.34.139
- bottleneck=1.4.0
- bs4=4.12.3
- cartopy=0.23.0
- colorcet=3.1.0
- dask=2024.7.0
- esmpy=8.6.1
- geopandas=0.14.4
- ipykernel=6.29.5
- joblib=1.4.2
- jupyter=1.0.0
- matplotlib=3.8.4
- netcdf4=1.7.1
- numpy=1.26.4
- pandas=2.2.2
- pyproj=3.6.1
- pyyaml=6.0.1
- regionmask=0.12.1
- scikit-learn=1.5.1
- scipy=1.14.0
- shapely=2.0.4
- xarray=2024.6.0
- xesmf=0.8.6
- geoschem-gcpy=1.6.1
- pypdf<5
- pip=24.0

# The following are installed separately via `pip install --no-deps` after
# env creation (see install_pip_deps.sh) rather than in a `pip:` section here:
# mamba's YAML pip-section installer validates each line as a package
# requirement, so it rejects a bare `--no-deps` flag placed in the list ---
# and without --no-deps, pip's resolver ignores the numpy=1.26.4 conda pin
# and upgrades to numpy 2.x while solving these packages' unpinned "numpy"
# requirement, breaking ABI compatibility with conda-built shapely/cartopy/etc.
#   git+https://github.com/LiamBindle/gridspec.git
#   git+https://github.com/LiamBindle/sparselt.git
#   spherical-geometry==1.3.3
#   pyogrio==0.13.0  # no conda-forge build for py3.11; fiona's reader chokes on some Natural Earth geometries, pyogrio doesn't
